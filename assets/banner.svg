<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="LeetCode-DSA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.45" stop-color="#1E1B4B"/>
      <stop offset="0.8" stop-color="#4A1D2E"/>
      <stop offset="1" stop-color="#7C2D12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F97316" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="0.35" stop-color="#FB923C"/>
      <stop offset="0.65" stop-color="#F43F5E"/>
      <stop offset="1" stop-color="#A855F7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F97316" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EF4444" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0.45"/>
    </linearGradient>
    <clipPath id="c"><rect width="1200" height="260"/></clipPath>
  </defs>

  <g clip-path="url(#c)">
    <rect width="1200" height="260" fill="url(#bg)"/>

    <!-- glowing orbs -->
    <circle cx="1020" cy="250" r="340" fill="url(#glow)">
      <animate attributeName="r" values="300;380;300" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="40" r="260" fill="url(#glow2)">
      <animate attributeName="r" values="230;290;230" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- twinkling stars -->
    <g fill="#fff">
      <circle cx="60" cy="50" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="170" cy="120" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="36" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="340" cy="150" r="1.2"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="62" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="28" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="40" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="790" cy="140" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="55" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="125" r="1.2"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="1050" cy="35" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="1140" cy="100" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="22" r="1"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="95" cy="170" r="1"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="3.3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- floating complexity glyphs -->
    <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="22" fill="#FDBA74" opacity="0.28">
      <text x="90" y="110">O(n)<animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="5s" repeatCount="indefinite"/></text>
      <text x="250" y="190">{ }<animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="6s" repeatCount="indefinite"/></text>
      <text x="960" y="100">log n<animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="5.5s" repeatCount="indefinite"/></text>
      <text x="1090" y="175">[ ]<animateTransform attributeName="transform" type="translate" values="0 0;0 -16;0 0" dur="4.5s" repeatCount="indefinite"/></text>
      <text x="40" y="215">O(1)<animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="6.5s" repeatCount="indefinite"/></text>
      <text x="1000" y="215">n&#178;<animateTransform attributeName="transform" type="translate" values="0 0;0 -11;0 0" dur="5.2s" repeatCount="indefinite"/></text>
    </g>

    <!-- animated waves (period 300 so the loop is seamless) -->
    <path fill="url(#w1)" d="M0 205 q75 -34 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 V260 H0 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-300 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#w2)" d="M0 225 q75 28 150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 t150 0 V260 H0 Z">
      <animateTransform attributeName="transform" type="translate" values="-300 0;0 0" dur="6s" repeatCount="indefinite"/>
    </path>

    <!-- title -->
    <g text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace">
      <text x="600" y="122" font-size="74" font-weight="800" fill="url(#ttl)">LeetCode-DSA</text>
      <text x="600" y="168" font-size="17" letter-spacing="3" fill="#FDBA74">DATA STRUCTURES &amp; ALGORITHMS  •  PATTERNS OVER MEMORIZATION</text>
    </g>
  </g>
</svg>
