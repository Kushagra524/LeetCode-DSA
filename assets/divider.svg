<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 8" width="1200" height="8" role="presentation">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="0.5" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#8B5CF6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="p" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="3" width="1200" height="2" rx="1" fill="url(#g)" opacity="0.85"/>
  <ellipse cx="0" cy="4" rx="60" ry="4" fill="url(#p)">
    <animate attributeName="cx" values="-60;1260" dur="5s" repeatCount="indefinite"/>
  </ellipse>
</svg>
